<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Bank - Terminal Cibersegura</title>
    <style>
        /* --- TU PALETA MINIMALISTA --- */
        :root{
            --fondo-oscuro: #003247;
            --fondo-tarjeta: #0b1a26;
            --texto-claro: #f4f6fc;
            --acento-salmon: #fa8072;
            --borde-hover: #00a8ff;
        }
    body {
        background-color: var(--fondo-oscuro);
        color: var(--texto-claro);
        font-family: 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .contenedor {
        background-color: var(--fondo-tarjeta);
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.6);
        width: 100%;
        max-width: 400px;
        border: 1px solid rgba(250, 128, 114, 0.2);
    }

    h2{
        color:var(--acento-salmon);
        text-align: center;
        margin-top: 0;
        letter-spacing: 1px;
    }

    .form-group{
        margin-bottom: 1.2rem;
    }

    label {
        display: block;
        margin-bottom: 0.4rem;
        font-size: 0.9rem;
        color: rgba(244, 246, 252, 0.8);
    }

    input, select {
        width: 100%;
        padding: 12px;
        border: 1px solid rgba(244, 246, 252, 0.3);
        background: rgba(0, 50, 71, 0.5);
        color: var(--texto-claro);
        border-radius: 6px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.3s;
    }

    input:focus, select:focus{
        border-color: var(--borde-hover);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 1rem;
        background-color: var(--acento-salmon);
        color: var(--fondo-oscuro);
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    button:hover {
        background-color: var(--texto-claro);
        transform: translateY(-2px);
    }

    .toggle-link {
        color:var(--acento-salmon);
        text-align: center;
        display: block;
        margin-top: 1.5rem;
        cursor: pointer;
        font-size: 0.9rem;
        text-decoration: underline;
    }

    .oculto {
        display: none !important;
    }

    /* Consola para ver la respuesta del servidor */
    .consola-log{
        margin-top: 1.5rem;
        padding: 15px;
        background: #000;
        color: #00ff00;
        font-family: monospace;
        border-radius: 6px;
        font-size: 0.85rem;
        white-space: pre-wrap;
        border-left: 3px solid var(--borde-hover);
        word-break: break-all;
    }
    </style>
</head>
<body>
    <div class="contenedor" id="app-container">

        <!-- VISTA: LOGIN-->
        <div id="vista-login">
            <h2>Acceso a Flux Bank</h2>
            <form id="form-login">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>

        <!-- VISTA: DASHBOARD BANCARIO-->
        <div id="vista-dashboard" class="oculto">
            <h2>Panel de Transferencias</h2>
            <p style="text-align: center; font-size: 0.8rem; margin-bottom: 20px;">ID Usuario: <span id="user-id-display"></span></p>

            <form id="form-transfer">
                <div class="form-group">
                    <label>Cuenta de Destino (Ej: AR123456789)</label>
                    <input type="text" id="trans-receiver" required>
                </div>
                <div class="form-group">
                    <label>Monto</label>
                    <input type="number" id="trans-amount" step="0.01" min="0.01" required>
                </div>
                <button type="submit">Ejecutar Transferencia Segura</button>
            </form>
            <span class="toggle-link" onclick="cerrarSesion()">Cerrar Sesión</span>
        </div>

        <!-- CONSOLA DE AUDITORÍA -->
        <pre id="consola" class="consola-log">Esperando acción...</pre>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        // Apunta directamente a tu API 24/7 en Discloud
        const API_BASE = "https://fluxbank.discloud.app/api";
        let sessionUserId = null;

        // --- FUNCIONES DE INTERFAZ ---
        function cambiarVista(idVista) {
            document.getElementById('vista-login').classList.add('oculto');
            document.getElementById('vista-dashboard').classList.add('oculto');
            document.getElementById(idVista).classList.remove('oculto');
        }
        
        function escribirConsola(objeto, titulo = "Respuesta del Servidor:") {
            const consola = document.getElementById('consola');
            consola.innerText = titulo + "\n" + JSON.stringify(objeto, null, 2);
        }

        function cerrarSesion() {
            sessionUserId = null;
            cambiarVista('vista-login');
            escribirConsola({ estado: "Sesión finalizada de forma segura." }, "Log de Auditoría:");
        }

        // --- PETICIONES FETCH A LA API EN FLASK ---

        // 1. LOGIN
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            escribirConsola({ estado: "Validando Hash Argon2id..." }, "Procesando:");

            const payload = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value,
            };

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                escribirConsola(data, `Estado HTTP: ${response.status}`);

                if (response.ok) {
                    // Guardamos el ID del usuario en memoria para hacer transferencias
                    sessionUserId = data.user_id;
                    document.getElementById('user-id-display').innerText = sessionUserId.substring(0,8) + "...";
                    setTimeout(() => cambiarVista('vista-dashboard'), 1500);
                }
            } catch (error) {
                escribirConsola({ error: error.message }, "Error de Conexión:");
            }
        });

        // 2. TRANSFERENCIA
        document.getElementById('form-transfer').addEventListener('submit', async (e) => {
            e.preventDefault();
            escribirConsola({ estado: "Aplicando bloqueo FOR UPDATE en la Base de Datos..."}, "Procesando Transacción ACID:");

            const payload = {
                sender_user_id: sessionUserId,
                receiver_account_number: document.getElementById('trans-receiver').value,
                amount: document.getElementById('trans-amount').value,
                description: "Transferencia desde Frontend"
            };

            try {
                const response = await fetch(`${API_BASE}/banking/transfer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                escribirConsola(data, `Estado HTTP: ${response.status} (Transacción Finalizada)`);
            } catch (error) {
                escribirConsola({ error: error.message }, "Error de Conexión:");
            }
        });
    </script>
</body>
</html>
